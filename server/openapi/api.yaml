  /roles/permissions:
    get:
      summary: >
        Get the full editable role/page/action permission matrix for the
        caller's entity (administrator only).
      operationId: getRolePermissions
      tags: [Roles]
      responses:
        '200':
          description: The current matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionMatrixResponse'
        '401':
          description: Unauthorised
        '403':
          description: Forbidden

    put:
      summary: >
        Replace the caller's entity permission overrides (or, for the
        template entity, the global defaults) with exactly what's submitted
        (administrator only).
      operationId: saveRolePermissions
      tags: [Roles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionSaveRequest'
      responses:
        '204':
          description: Saved
        '400':
          description: >
            Validation error, including a save that would leave
            administrator without read+write on the Roles page itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
        '403':
          description: Forbidden

  /roles/effective:
    get:
      summary: >
        Get the caller's own resolved page/action permissions — used by the
        client to render navigation and action buttons. Server-side route
        guards remain the actual enforcement point.
      operationId: getEffectivePermissions
      tags: [Roles]
      responses:
        '200':
          description: The caller's flattened permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePermissionsResponse'
        '401':
          description: Unauthorised
