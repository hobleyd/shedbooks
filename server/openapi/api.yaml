openapi: 3.0.3
info:
  title: ShedBooks API
  description: ShedBooks backend REST API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Microsoft Entra ID JWT access token

  schemas:
    GeneralLedger:
      type: object
      required: [id, label, description, gstApplicable, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 255
        description:
          type: string
        gstApplicable:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateGeneralLedgerRequest:
      type: object
      required: [label, description, gstApplicable]
      properties:
        label:
          type: string
          maxLength: 255
          minLength: 1
        description:
          type: string
          minLength: 1
        gstApplicable:
          type: boolean

    UpdateGeneralLedgerRequest:
      type: object
      required: [label, description, gstApplicable]
      properties:
        label:
          type: string
          maxLength: 255
          minLength: 1
        description:
          type: string
          minLength: 1
        gstApplicable:
          type: boolean

    GstRate:
      type: object
      required: [id, rate, effectiveFrom, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Decimal fraction — e.g. 0.10 represents 10%
        effectiveFrom:
          type: string
          format: date
          description: The date from which this rate applies (YYYY-MM-DD)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Contact:
      type: object
      required: [id, name, contactType, gstRegistered, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 500
        contactType:
          type: string
          enum: [person, company]
        gstRegistered:
          type: boolean
          description: Always false when contactType is person
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateContactRequest:
      type: object
      required: [name, contactType, gstRegistered]
      properties:
        name:
          type: string
          maxLength: 500
          minLength: 1
        contactType:
          type: string
          enum: [person, company]
        gstRegistered:
          type: boolean

    UpdateContactRequest:
      type: object
      required: [name, contactType, gstRegistered]
      properties:
        name:
          type: string
          maxLength: 500
          minLength: 1
        contactType:
          type: string
          enum: [person, company]
        gstRegistered:
          type: boolean

    Transaction:
      type: object
      required: [id, contactId, generalLedgerId, amount, gstAmount, transactionType, receiptNumber, transactionDate, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        contactId:
          type: string
          format: uuid
        generalLedgerId:
          type: string
          format: uuid
        amount:
          type: integer
          minimum: 1
          description: Transaction value in cents
        gstAmount:
          type: integer
          minimum: 0
          description: GST component in cents (0 when not applicable)
        transactionType:
          type: string
          enum: [debit, credit]
        receiptNumber:
          type: string
          maxLength: 100
        transactionDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        splitGroupId:
          type: string
          format: uuid
          description: Shared by every row of one split transaction (one payment coded to several general ledger accounts). Absent for an ordinary transaction.
        splitLineNo:
          type: integer
          minimum: 1
          description: 1-based position of this row within its split. Absent for an ordinary transaction.

    TransactionLine:
      type: object
      required: [generalLedgerId, amount, gstAmount]
      properties:
        generalLedgerId:
          type: string
          format: uuid
        amount:
          type: integer
          minimum: 1
          description: Line value in cents, excluding GST
        gstAmount:
          type: integer
          minimum: 0
          description: GST component of the line in cents (must not exceed amount)
        description:
          type: string

    SplitTransactionRequest:
      type: object
      description: >
        One payment coded to several general ledger accounts. Stored as one
        Transaction row per line; the rows share contact, date, receipt number,
        payment reference, bank account and cash flag.
      required: [contactId, transactionType, receiptNumber, transactionDate, lines]
      properties:
        contactId:
          type: string
          format: uuid
        transactionType:
          type: string
          enum: [debit, credit]
        receiptNumber:
          type: string
          maxLength: 100
          minLength: 1
        paymentReference:
          type: string
        transactionDate:
          type: string
          format: date
        isCash:
          type: boolean
        bankAccountId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          maxItems: 50
          description: At least 2 lines on create. On update, exactly 1 line collapses the split back into an ordinary transaction.
          items:
            $ref: '#/components/schemas/TransactionLine'

    CreateTransactionRequest:
      type: object
      required: [contactId, generalLedgerId, amount, gstAmount, transactionType, receiptNumber, transactionDate]
      properties:
        contactId:
          type: string
          format: uuid
        generalLedgerId:
          type: string
          format: uuid
        amount:
          type: integer
          minimum: 1
        gstAmount:
          type: integer
          minimum: 0
        transactionType:
          type: string
          enum: [debit, credit]
        receiptNumber:
          type: string
          maxLength: 100
          minLength: 1
        transactionDate:
          type: string
          format: date

    UpdateTransactionRequest:
      type: object
      required: [contactId, generalLedgerId, amount, gstAmount, transactionType, receiptNumber, transactionDate]
      properties:
        contactId:
          type: string
          format: uuid
        generalLedgerId:
          type: string
          format: uuid
        amount:
          type: integer
          minimum: 1
        gstAmount:
          type: integer
          minimum: 0
        transactionType:
          type: string
          enum: [debit, credit]
        receiptNumber:
          type: string
          maxLength: 100
          minLength: 1
        transactionDate:
          type: string
          format: date

    CreateGstRateRequest:
      type: object
      required: [rate, effectiveFrom]
      properties:
        rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
        effectiveFrom:
          type: string
          format: date

    UpdateGstRateRequest:
      type: object
      required: [rate, effectiveFrom]
      properties:
        rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
        effectiveFrom:
          type: string
          format: date

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    BudgetLine:
      type: object
      required: [generalLedgerId, months]
      properties:
        generalLedgerId:
          type: string
          format: uuid
        months:
          type: array
          items:
            type: integer
            minimum: 0
          minItems: 12
          maxItems: 12
          description: Monthly budget amounts in cents; index 0 = January.

    BudgetResponse:
      type: object
      required: [year, lines]
      properties:
        year:
          type: integer
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BudgetLine'

    SaveBudgetRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BudgetLine'

    ParsedImportRow:
      type: object
      required: [externalCode, externalName, months, confidence]
      properties:
        externalCode:
          type: string
        externalName:
          type: string
        suggestedGlId:
          type: string
          format: uuid
          nullable: true
        suggestedGlLabel:
          type: string
          nullable: true
        months:
          type: array
          items:
            type: integer
          minItems: 12
          maxItems: 12
        confidence:
          type: number
          minimum: 0
          maximum: 1

    ParseImportResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ParsedImportRow'

    ConfirmedImportRow:
      type: object
      required: [externalCode, generalLedgerId, months]
      properties:
        externalCode:
          type: string
        externalName:
          type: string
        generalLedgerId:
          type: string
          format: uuid
        months:
          type: array
          items:
            type: integer
          minItems: 12
          maxItems: 12

    ConfirmImportRequest:
      type: object
      required: [rows, saveMappings]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ConfirmedImportRow'
        saveMappings:
          type: boolean

    GlMapping:
      type: object
      required: [externalCode, externalName, generalLedgerId]
      properties:
        externalCode:
          type: string
        externalName:
          type: string
        generalLedgerId:
          type: string
          format: uuid

    GlMappingsResponse:
      type: object
      required: [mappings]
      properties:
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/GlMapping'

    SaveGlMappingsRequest:
      type: object
      required: [mappings]
      properties:
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/GlMapping'

    PagePermissionCell:
      type: object
      required: [page, role, canRead, canWrite, isOverride]
      properties:
        page:
          type: string
          description: Stable page key, e.g. "transactions", "admin-roles".
        role:
          type: string
          enum: [viewer, contributor, administrator]
        canRead:
          type: boolean
        canWrite:
          type: boolean
        isOverride:
          type: boolean
          description: >
            True when this cell is an explicit override for the requesting
            entity (or, for the template entity, an explicit global default)
            rather than inherited.

    ActionPermissionCell:
      type: object
      required: [action, role, canPerform, isOverride]
      properties:
        action:
          type: string
          description: Stable action key, e.g. "transactions-import".
        role:
          type: string
          enum: [viewer, contributor, administrator]
        canPerform:
          type: boolean
        isOverride:
          type: boolean

    RolePermissionMatrixResponse:
      type: object
      required: [isTemplateEntity, pages, actions]
      properties:
        isTemplateEntity:
          type: boolean
          description: >
            When true, saving this matrix updates the global defaults that
            future entities inherit, rather than only this entity's own
            overrides.
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PagePermissionCell'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionPermissionCell'

    PagePermissionOverrideInput:
      type: object
      required: [page, role, canRead, canWrite]
      properties:
        page:
          type: string
        role:
          type: string
          enum: [viewer, contributor, administrator]
        canRead:
          type: boolean
        canWrite:
          type: boolean

    ActionPermissionOverrideInput:
      type: object
      required: [action, role, canPerform]
      properties:
        action:
          type: string
        role:
          type: string
          enum: [viewer, contributor, administrator]
        canPerform:
          type: boolean

    RolePermissionSaveRequest:
      type: object
      required: [pages, actions]
      description: >
        The complete desired override state — any cell not listed here
        resets to "inherit" from the applicable default.
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PagePermissionOverrideInput'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionPermissionOverrideInput'

    EffectivePagePermission:
      type: object
      required: [canRead, canWrite]
      properties:
        canRead:
          type: boolean
        canWrite:
          type: boolean

    EffectivePermissionsResponse:
      type: object
      required: [pages, actions]
      description: The caller's own flattened, resolved permissions.
      properties:
        pages:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EffectivePagePermission'
        actions:
          type: object
          additionalProperties:
            type: boolean

paths:
  /general-ledger:
    get:
      summary: List all general ledger accounts
      operationId: listGeneralLedger
      tags: [GeneralLedger]
      responses:
        '200':
          description: List of general ledger accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeneralLedger'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a general ledger account
      operationId: createGeneralLedger
      tags: [GeneralLedger]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGeneralLedgerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralLedger'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /general-ledger/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get a general ledger account by ID
      operationId: getGeneralLedger
      tags: [GeneralLedger]
      responses:
        '200':
          description: General ledger account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralLedger'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update a general ledger account
      operationId: updateGeneralLedger
      tags: [GeneralLedger]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGeneralLedgerRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralLedger'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a general ledger account
      operationId: deleteGeneralLedger
      tags: [GeneralLedger]
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gst-rates:
    get:
      summary: List all GST rates
      operationId: listGstRates
      tags: [GstRate]
      responses:
        '200':
          description: List of GST rates ordered by effectiveFrom descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GstRate'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new GST rate
      operationId: createGstRate
      tags: [GstRate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGstRateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GstRate'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A rate with the same effectiveFrom already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gst-rates/effective:
    get:
      summary: Get the GST rate effective at a given date (defaults to now)
      operationId: getEffectiveGstRate
      tags: [GstRate]
      parameters:
        - name: at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Point in time to query; defaults to current UTC time
      responses:
        '200':
          description: The applicable GST rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GstRate'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No rate is effective at the requested date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gst-rates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get a GST rate by ID
      operationId: getGstRate
      tags: [GstRate]
      responses:
        '200':
          description: GST rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GstRate'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update a GST rate
      operationId: updateGstRate
      tags: [GstRate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGstRateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GstRate'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A rate with the same effectiveFrom already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a GST rate
      operationId: deleteGstRate
      tags: [GstRate]
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contacts:
    get:
      summary: List all contacts
      operationId: listContacts
      tags: [Contact]
      responses:
        '200':
          description: List of contacts ordered by name ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a contact
      operationId: createContact
      tags: [Contact]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          description: Bad request (includes person + gstRegistered=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contacts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get a contact by ID
      operationId: getContact
      tags: [Contact]
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update a contact
      operationId: updateContact
      tags: [Contact]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          description: Bad request (includes person + gstRegistered=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a contact
      operationId: deleteContact
      tags: [Contact]
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions:
    get:
      summary: List all transactions
      operationId: listTransactions
      tags: [Transaction]
      responses:
        '200':
          description: List of transactions ordered by date descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a transaction
      operationId: createTransaction
      tags: [Transaction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateTransactionRequest'
                - $ref: '#/components/schemas/SplitTransactionRequest'
      responses:
        '201':
          description: Created. A split request (body with `lines`) returns the array of created rows, one per line.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Transaction'
                  - type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
        '400':
          description: Bad request (invalid amounts, missing FK targets, empty receiptNumber)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get a transaction by ID
      operationId: getTransaction
      tags: [Transaction]
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update a transaction
      operationId: updateTransaction
      tags: [Transaction]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UpdateTransactionRequest'
                - $ref: '#/components/schemas/SplitTransactionRequest'
      responses:
        '200':
          description: >
            Updated. A split request (body with `lines`) replaces the
            transaction and every other line of its split, and returns the
            array of resulting rows. One line of a split cannot be updated
            without `lines` (400).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Transaction'
                  - type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a transaction
      description: Deleting one line of a split transaction deletes every line of that split.
      operationId: deleteTransaction
      tags: [Transaction]
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

